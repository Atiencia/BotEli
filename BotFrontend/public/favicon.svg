<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Antenna -->
  <path d="M55 35 V20 H40" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Left Ear -->
  <line x1="10" y1="55" x2="18" y2="55" stroke="#111111" stroke-width="8" stroke-linecap="round" />
  
  <!-- Right Ear -->
  <line x1="82" y1="55" x2="90" y2="55" stroke="#111111" stroke-width="8" stroke-linecap="round" />
  
  <!-- Head -->
  <rect x="18" y="35" width="64" height="40" rx="12" stroke="#111111" stroke-width="8" fill="white" />
  
  <!-- Left Eye -->
  <rect x="34" y="48" width="10" height="18" rx="5" fill="#00A6F4" />
  
  <!-- Right Eye -->
  <rect x="56" y="48" width="10" height="18" rx="5" fill="#00A6F4" />
</svg>